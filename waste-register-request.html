                <h4 class="fw-bold mb-1"><i class="fa-solid fa-user-plus text-success me-2"></i>คำขอขึ้นทะเบียนใหม่</h4>
                <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0" style="font-size:0.8rem;">
                    <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">แดชบอร์ด</a></li>

        <!-- Summary -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-4"><div class="kpi-card"><div class="d-flex justify-content-between align-items-start"><div><div class="kpi-label mb-1">รอตรวจสอบ</div><div class="kpi-value text-warning" id="regPending">-</div></div><div class="kpi-icon bg-warning bg-opacity-10 text-warning"><i class="fa-solid fa-clock"></i></div></div></div></div>

            <div class="col-6 col-lg-4"><div class="kpi-card"><div class="d-flex justify-content-between align-items-start"><div><div class="kpi-label mb-1">ปฏิเสธ</div><div class="kpi-value text-danger" id="regRejected">-</div></div><div class="kpi-icon bg-danger bg-opacity-10 text-danger"><i class="fa-solid fa-xmark"></i></div></div></div></div>

        <!-- Table -->

<!-- Detail Modal -->

<script>
document.addEventListener('DOMContentLoaded', async function() {
    Swal.fire({title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
    try {
        initWasteData();
        await Promise.all([
            fetchWasteFeeTypes(),
            fetchWasteCustomers(),
            loadRegRequests()
        ]);
        Swal.close();
    } catch(e) {
        console.error(e);
        Swal.close();
    }
});

async function loadRegRequests() {
    await fetchWasteFeeTypes();
    const reqs = await fetchRegisterRequestsDB();
    renderRegRequests(reqs);
}

function renderRegRequests(reqs) {
    if (!reqs) reqs = getRegisterRequests();
    
    document.getElementById('regPending').textContent = reqs.filter(r=>r.status==='pending').length;
    document.getElementById('regApproved').textContent = reqs.filter(r=>r.status==='approved').length;
    document.getElementById('regRejected').textContent = reqs.filter(r=>r.status==='rejected').length;

    const tbody = document.getElementById('regTableBody');
    
    if (reqs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-5"><i class="fa-solid fa-inbox mb-2" style="font-size:2rem;opacity:.3;"></i><br>ยังไม่มีคำขอขึ้นทะเบียน</td></tr>`;
        return;
    }
    
    tbody.innerHTML = reqs.map((r, idx) => {
        const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('th-TH', {day:'numeric',month:'short',year:'2-digit'}) : (r.date || '-');
        const hasImage = r.image_url ? true : false;
        const hasLocation = r.lat && r.lng ? true : false;
        const statusBadge = r.status==='pending' ? 'bg-warning text-dark' : r.status==='approved' ? 'bg-success' : 'bg-danger';
        const statusText = r.status==='pending' ? 'รอตรวจสอบ' : r.status==='approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธ';

        return `<tr>
        <td class="ps-4 fw-semibold text-xs">${idx+1}</td>
        <td>${r.name || '-'}</td>
        <td>${r.house_no || '-'} ม.${r.moo || '-'}</td>
        <td><span class="badge bg-light text-dark">${r.type || '-'}</span></td>
        <td class="text-xs">${r.phone||'-'}</td>
        <td class="text-xs text-muted">${dateStr}</td>
        <td>
            ${hasImage ? `<button class="btn btn-xs btn-outline-info me-1" onclick="viewRegDetail('${r.id}')" title="ดูรูปภาพ"><i class="fa-solid fa-image"></i></button>` : ''}
            ${hasLocation ? `<button class="btn btn-xs btn-outline-primary" onclick="viewRegDetail('${r.id}')" title="ดูแผนที่"><i class="fa-solid fa-map-location-dot"></i></button>` : ''}
            ${!hasImage && !hasLocation ? '<span class="text-xs text-muted">-</span>' : ''}
        </td>
        <td><span class="badge ${statusBadge}">${statusText}</span></td>
        <td class="pe-4 text-center">
            ${r.status==='pending'?`
                <button class="btn btn-xs btn-outline-info me-1" onclick="viewRegDetail('${r.id}')"><i class="fa-solid fa-pen-to-square me-1"></i>ดู/แก้ไข</button>
                <button class="btn btn-xs btn-success me-1" onclick="approveReg('${r.id}')"><i class="fa-solid fa-check me-1"></i>อนุมัติ</button>
                <button class="btn btn-xs btn-outline-danger me-1" onclick="rejectReg('${r.id}')" title="ปฏิเสธคำขอ"><i class="fa-solid fa-xmark"></i></button>
            `:'<span class="text-xs text-muted me-2">ดำเนินการแล้ว</span>'}
            <button class="btn btn-xs btn-outline-danger" onclick="deleteRegRequest('${r.id}')" title="ลบคำขอ"><i class="fa-solid fa-trash-can"></i></button>
        </td>
    </tr>`;
    }).join('');
}

let detailMap = null;

function onSelectRegFeeRate(selectEl) {
    const opt = selectEl.options[selectEl.selectedIndex];
    if (!opt) return;
    const selectedType = opt.getAttribute('data-type') || '';
    const selectedFee = opt.getAttribute('data-fee') || '';

    const typeSelect = document.getElementById('editRegType');
    if (typeSelect && selectedType) {
        // Ensure option exists in #editRegType
        let exists = Array.from(typeSelect.options).some(o => o.value === selectedType);
        if (!exists) {
            const newOpt = document.createElement('option');
            newOpt.value = selectedType;
            newOpt.textContent = selectedType;
            typeSelect.appendChild(newOpt);
        }
        typeSelect.value = selectedType;
    }

    const feeInput = document.getElementById('editRegFee');
    if (feeInput && selectedFee !== '') {
        feeInput.value = selectedFee;
    }

    const summaryEl = document.getElementById('regFeeSelectedSummary');
    if (summaryEl) {
        if (selectedType && selectedFee !== '') {
            summaryEl.innerHTML = `<i class="fa-solid fa-circle-check text-success me-1"></i>จะบันทึกเป็นประเภท: <b class="text-dark">${selectedType}</b> • ค่าธรรมเนียม: <b class="text-success">฿${formatMoney(Number(selectedFee))}/เดือน</b>`;
        } else {
            summaryEl.innerHTML = `<span class="text-danger"><i class="fa-solid fa-circle-exclamation me-1"></i>กรุณาเลือกเรทราคาค่าธรรมเนียมขยะ</span>`;
        }
    }
}

function extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return '';
    const m1 = url.match(/\/d\/([a-zA-Z0-9_-]{15,})/);
    if (m1) return m1[1];
    const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
    if (m2) return m2[1];
    const m3 = url.match(/[-\w]{25,}/);
    if (m3 && (url.includes('drive.google.com') || url.includes('googleusercontent.com'))) return m3[0];
    return '';
}

function handleDriveImgError(imgEl, fileId, rawUrl) {
    if (!imgEl) return;
    const step = parseInt(imgEl.getAttribute('data-fallback-step') || '0', 10);
    if (fileId && step === 0) {
        imgEl.setAttribute('data-fallback-step', '1');
        imgEl.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
        return;
    }
    if (fileId && step === 1) {
        imgEl.setAttribute('data-fallback-step', '2');
        imgEl.src = `https://drive.google.com/uc?export=view&id=${fileId}`;
        return;
    }
    // Fallback to Google Drive Embedded Preview iframe (works even when 3rd-party image cookies are blocked in Incognito)
    const wrapper = imgEl.parentElement;
    if (wrapper) {
        if (fileId) {
            wrapper.innerHTML = `
                <iframe src="https://drive.google.com/file/d/${fileId}/preview"
                        style="width:100%; height:240px; border:1px solid #dee2e6; border-radius:10px; background:#f8fafc;"
                        allow="autoplay"></iframe>
            `;
        } else {
            wrapper.innerHTML = `
                <div class="p-4 rounded-3 border bg-light text-muted text-sm">
                    <i class="fa-regular fa-image fa-2x mb-2 d-block opacity-50"></i>
                    ไม่สามารถแสดงตัวอย่างรูปภาพได้ กรุณากดปุ่ม "เปิดใน Google Drive" ด้านล่าง
                </div>
            `;
        }
    }
}

async function viewRegDetail(id) {
    // Ensure fee types are loaded from settings
    let feeTypes = getWasteFeeTypes();
    if (!feeTypes || feeTypes.length === 0) {
        feeTypes = await fetchWasteFeeTypes();
    }

    const reqs = getRegisterRequests();
    const r = reqs.find(x => String(x.id) === String(id));
    if (!r) return;

    const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('th-TH', {day:'numeric',month:'long',year:'numeric'}) : (r.date || '-');
    const statusBadge = r.status==='pending' ? 'bg-warning text-dark' : r.status==='approved' ? 'bg-success' : 'bg-danger';
    const statusText = r.status==='pending' ? 'รอตรวจสอบ' : r.status==='approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธ';

    let imageHtml = '';
    if (r.image_url) {
        const fileId = extractDriveFileId(r.image_url);
        const primaryImgSrc = fileId ? `https://lh3.googleusercontent.com/d/${fileId}=w800` : r.image_url;
        const safeRawUrl = String(r.image_url).replace(/'/g, "\\'");
        imageHtml = `
        <div class="mb-3">
            <label class="form-label fw-semibold text-sm"><i class="fa-solid fa-image text-info me-1"></i>รูปภาพสถานที่</label>
            <div class="text-center">
                <div id="regDetailImgWrapper">
                    <img src="${primaryImgSrc}"
                         referrerpolicy="no-referrer"
                         class="img-fluid rounded shadow-sm border"
                         style="max-height:260px;cursor:pointer;"
                         onclick="window.open('${safeRawUrl}','_blank')"
                         onerror="handleDriveImgError(this, '${fileId}', '${safeRawUrl}')">
                </div>
                <div class="mt-2"><a href="${r.image_url}" target="_blank" class="btn btn-sm btn-outline-info rounded-pill"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i>เปิดใน Google Drive</a></div>
            </div>
        </div>`;
    }

    let mapHtml = '';
    if (r.lat && r.lng) {
        mapHtml = `
        <div class="mb-3">
            <label class="form-label fw-semibold text-sm"><i class="fa-solid fa-map-location-dot text-primary me-1"></i>พิกัดตำแหน่ง (${Number(r.lat).toFixed(5)}, ${Number(r.lng).toFixed(5)})</label>
            <div id="detailMap" style="height:220px;width:100%;border-radius:10px;border:1px solid #dee2e6;"></div>
            <div class="mt-2"><a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fa-solid fa-diamond-turn-right me-1"></i>เปิดใน Google Maps</a></div>
        </div>`;
    }

    let infoHtml = '';
    if (r.status === 'pending') {
        const typeNames = Array.from(new Set(['ประกอบกิจการ', 'บ้านทั่วไป', ...feeTypes.map(f => f.type), r.type].filter(Boolean)));
        const typeOptions = typeNames.map(tName => `<option value="${tName}" ${r.type===tName?'selected':''}>${tName}</option>`).join('');

        // Pre-match fee rate from waste_fee_types if possible
        const initialMatchedFee = feeTypes.find(f => f.type === r.type) || null;
        const rateOptionsHtml = feeTypes.map(f => {
            const isSel = initialMatchedFee && String(initialMatchedFee.id) === String(f.id);
            return `<option value="${f.id}" data-type="${f.type}" data-fee="${f.fee}" ${isSel ? 'selected' : ''}>${f.type} — ฿${formatMoney(f.fee)} / เดือน</option>`;
        }).join('');
        const initialFeeVal = initialMatchedFee ? initialMatchedFee.fee : '';
        const initialTypeVal = initialMatchedFee ? initialMatchedFee.type : (r.type || '');
        
        infoHtml = `
            <table class="table table-sm table-borderless text-sm mb-0">
                <tr><td class="text-muted align-middle" style="width:125px;"><i class="fa-solid fa-user me-1"></i>ชื่อ</td>
                    <td><input type="text" id="editRegName" class="form-control form-control-sm" value="${r.name || ''}"></td></tr>
                <tr><td class="text-muted align-middle"><i class="fa-solid fa-house me-1"></i>บ้านเลขที่</td>
                    <td><div class="input-group input-group-sm"><input type="text" id="editRegHouseNo" class="form-control" value="${r.house_no || ''}"><span class="input-group-text">ม.</span><input type="text" id="editRegMoo" class="form-control" value="${r.moo || ''}"></div></td></tr>
                <tr><td class="text-muted align-middle"><i class="fa-solid fa-building me-1"></i>ประเภทที่ขอ</td>
                    <td>
                        <select id="editRegType" class="form-select form-select-sm bg-light" disabled title="ประเภทจะถูกอัปเดตตามเรทราคาค่าธรรมเนียมที่เลือกด้านล่าง">
                            <option value="">เลือกประเภท...</option>${typeOptions}
                        </select>
                        <div class="text-muted mt-1" style="font-size:0.72rem;">ผู้ยื่นขอเลือกมาเป็น: <b>${r.type || '-'}</b></div>
                    </td></tr>
                <tr><td class="text-muted align-middle"><i class="fa-solid fa-tags text-success me-1"></i>เรทค่าธรรมเนียม <span class="text-danger">*</span></td>
                    <td>
                        <select id="editRegFeeRate" class="form-select form-select-sm border-success fw-semibold text-dark" onchange="onSelectRegFeeRate(this)">
                            <option value="" data-type="" data-fee="">-- เลือกเรทประเภทและราคาค่าธรรมเนียม --</option>
                            ${rateOptionsHtml}
                        </select>
                        <input type="hidden" id="editRegFee" value="${initialFeeVal}">
                        <div id="regFeeSelectedSummary" class="mt-1" style="font-size:0.75rem;">
                            ${initialMatchedFee
                                ? `<i class="fa-solid fa-circle-check text-success me-1"></i>จะบันทึกเป็นประเภท: <b class="text-dark">${initialTypeVal}</b> • ค่าธรรมเนียม: <b class="text-success">฿${formatMoney(Number(initialFeeVal))}/เดือน</b>`
                                : `<span class="text-danger"><i class="fa-solid fa-circle-exclamation me-1"></i>กรุณาเลือกเรทราคาค่าธรรมเนียมขยะเพื่อกำหนดประเภทบ้านและราคา</span>`}
                        </div>
                    </td></tr>
                <tr><td class="text-muted align-middle"><i class="fa-solid fa-phone me-1"></i>โทรศัพท์</td>
                    <td><input type="text" id="editRegPhone" class="form-control form-control-sm" value="${r.phone || ''}"></td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-calendar me-1"></i>วันที่ยื่น</td><td class="align-middle">${dateStr}</td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-circle-info me-1"></i>สถานะ</td><td class="align-middle"><span class="badge ${statusBadge}">${statusText}</span></td></tr>
            </table>
            <div class="mt-4 pt-3 border-top text-end">
                <button class="btn btn-sm btn-success px-4 rounded-pill shadow-sm" onclick="saveAndApproveReg('${r.id}')"><i class="fa-solid fa-check me-2"></i>บันทึกและอนุมัติ</button>
            </div>
        `;
    } else {
        infoHtml = `
            <table class="table table-sm table-borderless text-sm mb-0">
                <tr><td class="text-muted" style="width:120px;"><i class="fa-solid fa-user me-1"></i>ชื่อ</td><td class="fw-semibold">${r.name || '-'}</td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-house me-1"></i>บ้านเลขที่</td><td class="fw-semibold">${r.house_no || '-'} หมู่ ${r.moo || '-'}</td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-building me-1"></i>ประเภท</td><td><span class="badge bg-light text-dark">${r.type || '-'}</span></td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-phone me-1"></i>โทรศัพท์</td><td>${r.phone || '-'}</td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-calendar me-1"></i>วันที่ยื่น</td><td>${dateStr}</td></tr>
                <tr><td class="text-muted"><i class="fa-solid fa-circle-info me-1"></i>สถานะ</td><td><span class="badge ${statusBadge}">${statusText}</span></td></tr>
            </table>
        `;
    }

    document.getElementById('regDetailBody').innerHTML = `
    <div class="row g-3">
        <div class="col-md-6">
            ${infoHtml}
        </div>
        <div class="col-md-6">
            ${imageHtml}
            ${mapHtml}
            ${!imageHtml && !mapHtml ? '<div class="text-center text-muted py-4"><i class="fa-solid fa-file-circle-xmark" style="font-size:2rem;opacity:.3;"></i><br><span class="text-sm">ไม่มีข้อมูลแนบ</span></div>' : ''}
        </div>
    </div>`;

    const modal = new bootstrap.Modal(document.getElementById('regDetailModal'));
    modal.show();

    // Initialize map after modal is shown
    if (r.lat && r.lng) {
        document.getElementById('regDetailModal').addEventListener('shown.bs.modal', function initMapOnce() {
            if (detailMap) { detailMap.remove(); detailMap = null; }
            detailMap = L.map('detailMap').setView([r.lat, r.lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(detailMap);
            L.marker([r.lat, r.lng]).addTo(detailMap).bindPopup(`<strong>${r.name}</strong><br>${r.house_no} ม.${r.moo}`).openPopup();
            document.getElementById('regDetailModal').removeEventListener('shown.bs.modal', initMapOnce);
        });
    }
}

async function saveAndApproveReg(id) {
    const rateSelect = document.getElementById('editRegFeeRate');
    const selectedOpt = rateSelect ? rateSelect.options[rateSelect.selectedIndex] : null;
    const selectedType = (selectedOpt && selectedOpt.getAttribute('data-type')) || document.getElementById('editRegType')?.value || '';
    const selectedFeeRaw = (selectedOpt && selectedOpt.getAttribute('data-fee')) || document.getElementById('editRegFee')?.value || '';

    if (!rateSelect || !rateSelect.value || !selectedType || selectedFeeRaw === '') {
        Swal.fire('กรุณาเลือกเรทค่าธรรมเนียม', 'โปรดเลือกเรทประเภทและราคาค่าธรรมเนียมขยะก่อนกดบันทึกและอนุมัติ', 'warning');
        return;
    }

    const selectedFee = Number(selectedFeeRaw) || 0;

    const result = await Swal.fire({
        title: 'ยืนยันการบันทึกและอนุมัติ?',
        html: `ระบบจะสร้างทะเบียนลูกค้าใหม่โดยกำหนด:<br><b>ประเภทบ้าน:</b> ${selectedType}<br><b>ค่าธรรมเนียม:</b> <span class="text-success fw-bold">฿${formatMoney(selectedFee)} / เดือน</span>`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'บันทึกและอนุมัติ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#057a55'
    });
    if (!result.isConfirmed) return;

    Swal.fire({title:'กำลังดำเนินการ...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});

    try {
        const reqs = getRegisterRequests();
        const r = reqs.find(x => String(x.id) === String(id));
        if (!r) { Swal.fire('ไม่พบข้อมูล','','error'); return; }

        // Update with new values from form including selected fee type
        r.name = document.getElementById('editRegName').value || r.name;
        r.house_no = document.getElementById('editRegHouseNo').value || r.house_no;
        r.moo = document.getElementById('editRegMoo').value || r.moo;
        r.type = selectedType;
        r.phone = document.getElementById('editRegPhone').value || r.phone;
        r.status = 'approved';

        // Update status in Supabase
        await saveRegisterRequestDB(r);

        // Ensure fresh customer list before generating ID
        await fetchWasteCustomers();

        // Create new customer with selected type and fee
        const newCustomer = {
            id: generateCustomerId(),
            house_no: r.house_no,
            moo: r.moo,
            name: r.name,
            id_card: '',
            phone: r.phone || '',
            type: selectedType,
            fee: selectedFee,
            start_date: new Date().toISOString().split('T')[0],
            status: 'active',
            lat: r.lat || null,
            lng: r.lng || null,
            note: 'สร้างจากคำขอขึ้นทะเบียน'
        };

        await saveWasteCustomerDB(newCustomer);
        
        const modal = bootstrap.Modal.getInstance(document.getElementById('regDetailModal'));
        if(modal) modal.hide();

        Swal.fire({
            title: 'อนุมัติสำเร็จ!',
            html: `สร้างทะเบียนลูกค้าใหม่เรียบร้อย<br><b>ประเภทบ้าน:</b> ${selectedType} (฿${formatMoney(selectedFee)}/เดือน)`,
            icon: 'success',
            confirmButtonColor: '#057a55'
        });
        await loadRegRequests();
    } catch(err) {
        console.error(err);
        Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถดำเนินการได้', 'error');
    }
}

async function approveReg(id) {
    // เปิดหน้าต่างรายละเอียดคำขอเพื่อให้เจ้าหน้าที่ตรวจสอบและเลือกเรทราคาค่าธรรมเนียมขยะก่อนอนุมัติ
    await viewRegDetail(id);
}

async function rejectReg(id) {
    const result = await Swal.fire({title:'ปฏิเสธคำขอ?',input:'text',inputPlaceholder:'ระบุเหตุผล...',showCancelButton:true,cancelButtonText:'ยกเลิก',confirmButtonColor:'#c81e1e',confirmButtonText:'ปฏิเสธ'});
    if (!result.isConfirmed) return;

    Swal.fire({title:'กำลังดำเนินการ...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});

    try {
        const reqs = getRegisterRequests();
        const r = reqs.find(x => String(x.id) === String(id));
        if (!r) { Swal.fire('ไม่พบข้อมูล','','error'); return; }

        r.status = 'rejected';
        r.note = result.value || 'ปฏิเสธ';

        await saveRegisterRequestDB(r);
        
        Swal.fire({title:'ปฏิเสธคำขอแล้ว',icon:'warning',confirmButtonColor:'#c81e1e'});
        await loadRegRequests();
    } catch(err) {
        console.error(err);
        Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถดำเนินการได้', 'error');
    }
}

async function deleteRegRequest(id) {
    const reqs = getRegisterRequests();
    const r = reqs.find(x => String(x.id) === String(id));
    const label = r ? `${r.name || '-'} (บ้านเลขที่ ${r.house_no || '-'} ม.${r.moo || '-'})` : id;

    const result = await Swal.fire({
        title: 'ยืนยันการลบคำขอ?',
        html: `ต้องการลบคำขอขึ้นทะเบียนของ<br><b>${label}</b> หรือไม่?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc2626',
        cancelButtonColor: '#6b7280',
        confirmButtonText: '<i class="fa-solid fa-trash-can me-1"></i>ลบคำขอ',
        cancelButtonText: 'ยกเลิก'
    });
    if (!result.isConfirmed) return;

    Swal.fire({title: 'กำลังลบคำขอ...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
    try {
        await deleteRegisterRequestDB(id);
        Swal.close();
        showToast('ลบคำขอขึ้นทะเบียนเรียบร้อยแล้ว', 'success');
        await loadRegRequests();
    } catch (err) {
        console.error(err);
        Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถลบคำขอได้', 'error');
    }
}
</script>
